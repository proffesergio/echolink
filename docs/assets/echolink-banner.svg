<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">EchoLink — Your content, connected</title>
  <desc id="desc">Content collection, branded creatives, editorial review, scheduled publishing and insights in one managed workspace.</desc>
