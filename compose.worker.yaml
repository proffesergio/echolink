services:
  echolink-worker:
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      - 127.0.0.1:8787:8787
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
