name: Test and deploy dashboard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate deployment credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Set the VERCEL_TOKEN repository secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Set the VERCEL_ORG_ID repository secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Set the VERCEL_PROJECT_ID repository secret"; exit 1; }
      - name: Install Vercel CLI
        run: npm install --global vercel@65.4.0
      - name: Verify deployment access
        run: node scripts/check-vercel-access.mjs
      - name: Pull production settings
        working-directory: deploy/vercel
        run: vercel pull --yes --environment=production
      - name: Build production deployment
        working-directory: deploy/vercel
        run: vercel build --prod
      - name: Publish dashboard
        working-directory: deploy/vercel
        run: |
          vercel deploy --prebuilt --prod
          echo "Dashboard: https://echolinkbd.vercel.app" >> "$GITHUB_STEP_SUMMARY"
